name: StanBridge Airways CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "stanbridge/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stanbridge_test
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/stanbridge_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check Node scripts
        run: |
          node --check prisma/seed.mjs
          node --check scripts/backup-postgres.mjs
          node --check scripts/password-hash-demo.mjs
