name: StanBridge production database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type I_HAVE_VERIFIED_BACKUP to approve the production migration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stanbridge-production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'I_HAVE_VERIFIED_BACKUP' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply reviewed Prisma migrations
        run: npx prisma migrate deploy
