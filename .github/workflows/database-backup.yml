name: StanBridge database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create and upload encrypted S3 backup
        run: node scripts/backup-postgres.mjs
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.BACKUP_DATABASE_URL }}
          APP_URL: ${{ vars.STANBRIDGE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
