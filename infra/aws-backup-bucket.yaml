AWSTemplateFormatVersion: "2010-09-09"
Description: Private encrypted and versioned S3 bucket for StanBridge Airways PostgreSQL backups.
Resources:
  StanBridgeBackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBackupVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
Outputs:
  BackupBucketName:
    Description: Set as AWS_S3_BUCKET in the StanBridge Airways server environment.
    Value: !Ref StanBridgeBackupBucket
  BackupBucketArn:
    Value: !GetAtt StanBridgeBackupBucket.Arn
