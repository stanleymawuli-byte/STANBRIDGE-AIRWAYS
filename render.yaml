databases:
  - name: stanbridge-airways-db
    databaseName: stanbridge_airways
    user: stanbridge_airways
    plan: free

services:
  - type: web
    name: stanbridge-airways
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: APP_URL
        value: https://stanbridge-airways.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: stanbridge-airways-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
